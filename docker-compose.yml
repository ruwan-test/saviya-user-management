services:
  mysql:
    image: mysql:8.4
    container_name: saviya-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-1234}
      MYSQL_DATABASE: saviya-user-manage
    ports:
      - "3306:3306"
    volumes:
      - saviya-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_PASSWORD:-1234}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: saviya-user-management:latest
    container_name: saviya-user-management
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/saviya-user-manage?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-1234}
      JWT_SECRET: ${JWT_SECRET:-saviyausermanage}

volumes:
  saviya-mysql-data:
